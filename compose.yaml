name: dvara

services:
  dvara:
    build: .
    image: dvara:latest
    ports:
      - "${DVARA_PORT:-8080}:8080"
    environment:
      DVARA_API_KEY: ${DVARA_API_KEY:-}
      DVARA_POOL_SIZE: ${DVARA_POOL_SIZE:-4}
      DVARA_MAX_CONCURRENT: ${DVARA_MAX_CONCURRENT:-12}
      DVARA_TIMEOUT_S: ${DVARA_TIMEOUT_S:-70}
      DVARA_DEFAULT_PROXY: ${DVARA_DEFAULT_PROXY:-}
      DVARA_DEVICE_SCALE_FACTOR: ${DVARA_DEVICE_SCALE_FACTOR:-1}
      DVARA_BROWSER_EXTRA: ${DVARA_BROWSER_EXTRA:-}
    volumes:
      - dvara-data:/data
    restart: unless-stopped
    mem_limit: ${DVARA_MEM_LIMIT:-4g}
    cpus: ${DVARA_CPUS:-4}

volumes:
  dvara-data:
